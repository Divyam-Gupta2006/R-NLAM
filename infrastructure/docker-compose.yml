services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: r-nlam-postgres
    environment:
      POSTGRES_DB: rnlam_db
      POSTGRES_USER: rnlam_user
      POSTGRES_PASSWORD: rnlam_password
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rnlam_user -d rnlam_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    container_name: r-nlam-redis
    ports:
      - '6379:6379'

  minio:
    image: quay.io/minio/minio:latest
    container_name: r-nlam-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data

  keycloak:
    image: quay.io/keycloak/keycloak:23.0.0
    command: start-dev --http-port 8080
    container_name: r-nlam-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: adminpassword
    ports:
      - '8085:8080'

volumes:
  postgres_data:
  minio_data:
